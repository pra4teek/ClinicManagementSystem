<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management System - Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <h1>Clinic Management System</h1>
            <p class="muted">Administrator Login</p>
            <form id="loginForm">
                <label>Username</label>
                <input id="loginUsername" type="text" required placeholder="Enter username">

                <label>Password</label>
                <input id="loginPassword" type="password" required placeholder="Enter password">

                <button type="submit" class="btn primary full">Login</button>
                <p id="loginError" class="error"></p>
            </form>
            <div class="demo-box">
                <strong>Demo login</strong><br>
                Username: <b>admin</b><br>
                Password: <b>admin123</b>
            </div>
        </div>
    </div>

    <div id="appPage" class="app hidden">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">+</div>
                <div>
                    <h2>Clinic Admin</h2>
                    <span>Management System</span>
                </div>
            </div>

            <nav>
                <button class="nav-btn active" data-section="dashboard">Dashboard</button>
                <button class="nav-btn" data-section="users">Users</button>
                <button class="nav-btn" data-section="roles">Roles</button>
                <button class="nav-btn" data-section="departments">Departments</button>
                <button class="nav-btn" data-section="staff">Staff</button>
                <button class="nav-btn" data-section="doctors">Doctors</button>
                <button class="nav-btn" data-section="lab-tests">Lab Tests</button>
                <button class="nav-btn" data-section="medicines">Medicines</button>
                <button class="nav-btn" data-section="appointments">Appointments</button>
                <button class="nav-btn" data-section="patients">Patients</button>
                <button class="nav-btn" data-section="audit-logs">Audit Logs</button>
            </nav>

            <button id="logoutBtn" class="logout-btn">Logout</button>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1 id="pageTitle">Dashboard</h1>
                    <p id="pageSubtitle">Clinic administration overview</p>
                </div>
                <div class="admin-user">
                    <span class="avatar">A</span>
                    <span>Administrator</span>
                </div>
            </header>

            <div id="toast" class="toast"></div>
            <section id="content"></section>
        </main>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">Add Record</h2>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <form id="recordForm"></form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
