<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Pharmacist Dashboard</title>
  <meta name="description" content="Production-grade Pharmacist Dashboard for Clinic Management System with dispensing analytics, stock categories, and prescribing doctor performance.">
  <meta property="og:title" content="CMS Pharmacist Dashboard">
  <meta property="og:description" content="Production-grade Pharmacist Dashboard for Clinic Management System with dispensing analytics, stock categories, and prescribing doctor performance.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js via CDN (strictly for bar chart only) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/frontend/shared/app-shell.css">

<style>
.dynamic-page-content{display:none;padding:28px 32px 48px;min-height:calc(100vh - 88px);background:#f8f8fc}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.page-heading h2{margin:0 0 6px;font-size:26px;color:#20213d}.page-heading p{margin:0;color:#777b98;font-size:14px}.page-actions{display:flex;gap:10px;flex-wrap:wrap}.page-card{background:#fff;border:1px solid #ececf5;border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(36,37,66,.05);margin-bottom:20px}.page-card h3{margin:0 0 6px;color:#252642;font-size:18px}.muted{color:#8588a3;font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.search-box{min-width:260px;flex:1;max-width:420px;position:relative}.search-box input{width:100%;box-sizing:border-box;border:1px solid #e2e3ef;border-radius:10px;padding:12px 14px 12px 40px;outline:0;font:inherit}.search-box span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#999bb1}.btn-primary,.btn-secondary,.btn-danger,.btn-small{border:0;border-radius:9px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.btn-primary{background:#4b3fe4;color:#fff}.btn-secondary{background:#f0effa;color:#4b3fe4}.btn-danger{background:#fff0f0;color:#d84d4d}.btn-small{padding:7px 10px;background:#f1f0fb;color:#4b3fe4;font-size:12px}.btn-small.danger{background:#fff0f0;color:#d84d4d}.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th{padding:13px 12px;text-align:left;background:#f8f8fc;color:#6f7290;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.data-table td{padding:14px 12px;border-bottom:1px solid #f0f0f6;color:#343550;font-size:13px}.status-badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.status-good{background:#e9f8ef;color:#23814c}.status-low{background:#fff4df;color:#a96a00}.status-out{background:#ffeaea;color:#c43d3d}.status-info{background:#ecebff;color:#5046c9}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.metric-card{background:#fff;border:1px solid #ececf5;border-radius:16px;padding:18px}.metric-card span{display:block;color:#7d809a;font-size:12px;margin-bottom:7px}.metric-card strong{color:#252642;font-size:25px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.form-group label{display:block;margin-bottom:7px;color:#555873;font-size:13px;font-weight:700}.form-group input,.form-group select,.form-group textarea{width:100%;box-sizing:border-box;border:1px solid #e2e3ef;border-radius:9px;padding:11px 12px;font:inherit;outline:0;background:#fff}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.empty-state{text-align:center;padding:42px 20px;color:#8588a3}.bill-summary{display:flex;justify-content:flex-end;margin-top:18px}.bill-total{min-width:220px;background:#f7f6ff;border-radius:12px;padding:15px 18px;text-align:right}.bill-total span{display:block;color:#777b98;font-size:12px}.bill-total strong{display:block;margin-top:4px;color:#4b3fe4;font-size:24px}.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.info-item{background:#f8f8fc;border-radius:12px;padding:16px}.info-item strong{display:block;margin-bottom:5px;color:#343550}.info-item span{color:#7c809a;font-size:13px}.toast-message{position:fixed;right:24px;bottom:24px;z-index:9999;background:#242542;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.18);font-size:13px;font-weight:600}@media(max-width:900px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.info-grid{grid-template-columns:1fr}}@media(max-width:700px){.dynamic-page-content{padding:20px 16px 40px}.page-heading{flex-direction:column}.form-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr}.search-box{min-width:100%;max-width:none}}
</style>
</head>
<body>

  <!-- Master App Container -->
  <div class="app-container">

    <!-- Mobile Drawer Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Sidebar Navigation -->
    <aside id="app-sidebar" class="sidebar" aria-label="Main Navigation">
      <div class="sidebar-top-section">
        <!-- Brand / Logo Header -->
        <div class="sidebar-header">
          <div class="sidebar-brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M12 2v20M2 12h20" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="sidebar-brand-name">Pharmacy</span>
        </div>

        <!-- Dynamic Navigation Links Container -->
        <nav id="sidebar-nav-container" class="sidebar-nav" aria-label="Sidebar Sections"></nav>
      </div>

      <!-- Bottom Low Stock Promotional / Alert Card -->
      <div class="sidebar-footer">
        <div id="sidebar-alert-container"></div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">

      <!-- Sticky Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <!-- Mobile Hamburger Toggle -->
          <button id="hamburger-btn" class="circle-btn hamburger-btn" aria-label="Toggle Navigation Sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <line x1="3" y1="12" x2="21" y2="12" stroke-linecap="round"/>
              <line x1="3" y1="6" x2="21" y2="6" stroke-linecap="round"/>
              <line x1="3" y1="18" x2="21" y2="18" stroke-linecap="round"/>
            </svg>
          </button>

          <!-- Topbar Titles (Populated dynamically) -->
          <div class="topbar-titles">
            <h1 class="topbar-title">Pharmacist Dashboard</h1>
            <span id="topbar-date" class="topbar-date"></span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Search Button -->
          <button class="circle-btn" aria-label="Search records and medicines">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/>
            </svg>
          </button>

          <!-- Notification Button with Red Badge -->
          <button class="circle-btn" aria-label="View notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="notification-badge" class="notification-badge" aria-hidden="true"></span>
          </button>

          <div class="topbar-divider" role="separator" aria-orientation="vertical"></div>

          <!-- User Info & Avatar -->
          <div id="user-profile-container" class="user-profile-badge" tabindex="0" role="button" aria-label="User Profile"></div>
        </div>
      </header>

      <!-- Main Dashboard Content Grid -->
      <main id="dashboard-page" class="dashboard-content" role="main">

        <!-- 1. Stat Cards Row (4 Cards populated dynamically from data) -->
        <section id="stat-cards-container" class="stat-cards-grid" aria-label="Key Performance Metrics"></section>

        <!-- 2. Mid Section: Main Bar Chart (60%) + Radial Statistic (40%) -->
        <section class="analytics-split-grid">

          <!-- Dispensing Activity Card -->
          <article class="cms-card chart-card" aria-label="Dispensing Activity Chart">
            <div class="cms-card-header">
              <div class="cms-card-title-group">
                <h2 class="cms-card-title">Dispensing Activity</h2>
                <span class="cms-card-subtitle">Prescription fulfillment & inventory restock trends</span>
              </div>
              <div id="chart-dropdown-container"></div>
            </div>

            <!-- Custom HTML Legend matching reference image -->
            <div id="chart-legend-container" class="chart-legend-container"></div>

            <!-- Canvas Container -->
            <div class="chart-canvas-container">
              <canvas id="dispensing-activity-chart"></canvas>
              <!-- Custom Speech Bubble Tooltip -->
              <div id="chartjs-custom-tooltip" style="opacity: 0;"></div>
            </div>
          </article>

          <!-- Stock by Category (Radial Concentric SVG Rings) -->
          <article class="cms-card radial-card" aria-label="Stock by Category Visualization">
            <div class="cms-card-header">
              <div class="cms-card-title-group">
                <h2 class="cms-card-title">Stock by Category</h2>
                <span class="cms-card-subtitle">Track your medicine inventory</span>
              </div>
              <div id="radial-dropdown-container"></div>
            </div>

            <!-- Concentric SVG Rings and Center/Side Metric -->
            <div class="radial-visual-row">
              <div id="radial-svg-box" class="radial-svg-box">
                <!-- Inline SVG dynamically generated by dashboard.js -->
              </div>
              <div id="radial-center-stat" class="radial-center-stat"></div>
            </div>

            <!-- Category rows list underneath -->
            <div id="stock-category-list" class="category-list"></div>
          </article>

        </section>

        <!-- 3. Lower Section: Top Prescribing Doctors (Bubble Card) -->
        <section class="lower-performance-grid">
          <article class="cms-card bubble-card" aria-label="Top Prescribing Doctors">
            <div class="cms-card-header">
              <div class="cms-card-title-group">
                <h2 class="cms-card-title">Top Prescribing Doctors</h2>
                <span class="cms-card-subtitle">Track prescriptions by physician</span>
              </div>
              <div id="doctors-dropdown-container"></div>
            </div>

            <div class="bubble-card-content">
              <!-- Left: Overlapping SVG/CSS Circles -->
              <div id="bubbles-stage" class="bubbles-stage"></div>

              <!-- Right: Doctors List with progress bars -->
              <div id="doctors-list" class="doctors-list"></div>
            </div>
          </article>
        </section>

      </main>

      <section id="dynamic-page-content" class="dynamic-page-content" aria-live="polite"></section>

    </div>

    <!-- Floating Action Button (Quick Dispense) -->
    <button id="quick-dispense-fab" class="fab-btn" aria-label="Quick Dispense Prescription">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round"/>
        <line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/>
      </svg>
      <span class="fab-tooltip">Quick Dispense</span>
    </button>

    <!-- Quick Dispense Accessible Modal -->
    <div id="quick-dispense-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-dispense-title" aria-hidden="true">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modal-dispense-title" class="modal-title">Quick Dispense Prescription</h3>
          <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18" stroke-linecap="round"/>
              <line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <form id="quick-dispense-form" class="modal-form">
          <div class="form-group">
            <label for="dispense-patient" class="form-label">Patient Name or MRN</label>
            <input type="text" id="dispense-patient" class="form-input" placeholder="e.g. Robert Davis (#PAT-1001)" required>
          </div>
          <div class="form-group">
            <label for="dispense-medicine" class="form-label">Prescribed Medicine</label>
            <select id="dispense-medicine" class="form-select" required>
              <!-- Populated by pharmacist.js from the real inventory on load -->
              <option value="">Select available stock...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="dispense-doctor" class="form-label">Prescribing Physician</label>
            <select id="dispense-doctor" class="form-select" required>
              <!-- Populated by pharmacist.js from data.js's shared user list on load -->
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" id="modal-cancel-btn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Dispense Now</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <!-- data.js MUST load first: pharmacist.js reads its shared users/patients/medicines on load -->
  <script src="/ClinicManagementSystem/frontend/shared/data.js"></script>
  <script src="/frontend/pharmacist/pharmacist.js"></script>
</body>
</html>
