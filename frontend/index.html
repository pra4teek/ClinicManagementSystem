<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · CarePoint Clinic</title>
  <link rel="stylesheet" href="shared/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-page);
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 900px 600px at 80% 20%, rgba(0,87,184,.07) 0%, transparent 70%);
    }

    .login-wrapper {
      display: flex;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-xl);
      max-width: 860px;
      width: 100%;
    }

    .login-side {
      flex: 0 0 340px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 2rem;
      color: #fff;
    }

    .login-side img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
    }

    .login-side-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(0, 40, 90, 0.75) 0%, rgba(0, 40, 90, 0.25) 50%, rgba(0, 40, 90, 0.75) 100%);
      z-index: 2;
    }

    .login-side-logo {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .side-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .side-brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.02em;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    .side-tagline {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .login-card {
      flex: 1;
      background: var(--bg-card);
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-card-header {
      margin-bottom: 2rem;
    }

    .login-card-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -.025em;
      margin-bottom: 0.35rem;
    }

    .login-card-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .login-wrapper { max-width: 440px; border-radius: var(--radius-lg); }
      .login-side    { display: none; }
      .login-card    { padding: 2.25rem 1.75rem; border-radius: var(--radius-lg); }
      .mobile-brand  { display: flex !important; }
    }

    .mobile-brand {
      display: none;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
    }

    .mobile-brand .side-icon {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      width: 40px;
      height: 40px;
      font-size: 1.25rem;
    }

    .mobile-brand span {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -.02em;
    }

    .input-group {
      position: relative;
    }

    .input-group .form-control {
      padding-right: 2.75rem;
    }

    .input-eye {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-muted);
      padding: 0;
      line-height: 1;
    }

    .input-eye:hover { color: var(--text-main); }

    #signInBtn {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.95rem;
      margin-top: 0.25rem;
      border-radius: var(--radius-sm);
      letter-spacing: .01em;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <div class="login-side">
      <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Clinic">
      <div class="login-side-overlay"></div>
      <div class="login-side-logo">
        <div class="side-icon">⚕️</div>
        <div>
          <div class="side-brand-name">CarePoint</div>
          <div class="side-tagline">Clinic Management System</div>
        </div>
      </div>
    </div>

    <div class="login-card">

      <div class="mobile-brand">
        <div class="side-icon">⚕️</div>
        <span>CarePoint Clinic</span>
      </div>

      <div class="login-card-header">
        <h1>Welcome back</h1>
        <p>Sign in to access your portal</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="doctor" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="input-eye" id="eyeBtn" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="signInBtn">
          Sign In →
        </button>
      </form>

    </div>
  </div>

  <script src="shared/data.js"></script>
  <script>
    const eyeBtn = document.getElementById('eyeBtn');
    const pwdInput = document.getElementById('password');
    eyeBtn.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      eyeBtn.textContent = '👁';
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      login(
        document.getElementById('username').value.trim(),
        document.getElementById('password').value.trim()
      );
    });

    function login(username, password) {
      const users = getStorage(CMS_KEYS.USERS, []);
      const match = users.find(u =>
        u.username.toLowerCase() === username.toLowerCase() && u.password === password
      );

      if (!match) {
        showToast('Invalid username or password.', 'danger');
        return;
      }

      setCurrentUser(match);
      showToast(`Welcome back, ${match.name}!`, 'success');

      setTimeout(() => {
        if      (match.role === 'Doctor')         window.location.href = 'doctor/doctor.html';
        else if (match.role === 'Receptionist')   window.location.href = 'receptionist/receptionist.html';
        else if (match.role === 'Pharmacist')     window.location.href = 'pharmacist/pharmacist.html';
        else if (match.role === 'Lab Technician') window.location.href = 'lab/lab.html';
        else if (match.role === 'Admin') {
          localStorage.setItem('clinicAdminLoggedIn', 'true');
          window.location.href = 'admin/admin.html';
        }
        else                                      window.location.href = 'doctor/doctor.html';
      }, 500);
    }
  </script>
</body>
</html>
